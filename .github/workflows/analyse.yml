name: Analyse

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: pip install yfinance requests pandas numpy scikit-learn
      - name: Volatilitaetsprognose
        run: python voltest.py
      - name: Analyse
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python analyse.py
      - name: Ergebnis speichern
        run: |
          git config user.name "analyse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "Analyse $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nichts zu speichern"
          git push
